<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Criador de Terror</title>
  <link rel="stylesheet" href="criador.css" />
</head>
<body>
  <button id="btnVoltar" class="btn-voltar">⬅ Voltar ao menu</button>

  <h1>👻 Crie seu Monstro</h1>

  <form id="formPersonagem">
    <input type="text" id="nome" placeholder="Nome do monstro" required />
    <p id="aviso" class="aviso"></p>

    <select id="tipo" required>
      <option value="">-- Escolha o tipo --</option>
    </select>

    <input type="number" id="perigo" min="1" max="5" placeholder="Perigo (1-5)" required />

    <button type="submit" id="btnSalvar">Adicionar</button>
    <button type="button" id="btnCancelar" class="btn-cancelar" style="display:none">
      Cancelar edição
    </button>
  </form>

  <hr />

  <div>
    <strong>Total: <span id="contador">0</span></strong>
  </div>

  <div class="acoes">
    <button class="btn-limpar" onclick="limparTudo()">🗑️ Limpar tudo</button>
  </div>

  <button id="btnJogar" class="btn-jogar" style="display:none">🌲 Ir para o jogo</button>

  <div id="listaPersonagens"></div>

  <hr />

  <h2 class="titulo-ranking">🏆 Ranking</h2>
  <div id="ranking"></div>

  <script src="criador.js"></script>
</body>
</html>
